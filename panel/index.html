<style>
/* Layout: control room — top bar with tabs, then one panel per tab (overview tiles + two daily bar charts, report queue, user table). Deliberately single dark neon look, matching the Wuzzo app. */
:root{
  --abyss:#060a1f; --deep:#0c1433; --panel:#121d47; --line:#22306a;
  --text:#eaf1ff; --muted:#8d9cc9;
  --volt:#2ee6ff; --azure:#2a6bff; --violet:#9b5cff; --rose:#ff5fa8;
  --good:#34d399; --warn:#fbbf24;
  --f-brand:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(80% 40% at 10% 0%, rgba(42,107,255,.22), transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-brand);font-size:22px;font-weight:700;letter-spacing:.04em}
.brand span{color:var(--volt);text-shadow:0 0 12px rgba(46,230,255,.7)}
.brand small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:6px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-radius:10px;padding:7px 12px;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{color:var(--volt);border-color:rgba(46,230,255,.4);background:rgba(46,230,255,.08)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted)}
.banner{margin-top:14px;padding:10px 14px;border-radius:12px;border:1px dashed var(--warn);color:var(--warn);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto}
h2{font-size:17px;margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--f-brand);font-size:26px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile.alert{border-color:rgba(255,95,168,.6);box-shadow:0 0 18px rgba(255,95,168,.18)}
.tile.alert .v{color:var(--rose)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.chart{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;position:relative;min-width:0}
.chart h3{margin:0;font-size:14px}
.chart .sub{color:var(--muted);font-size:12px}
.chart svg{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--volt);border-color:var(--volt)}
.reports{display:flex;flex-direction:column;gap:10px}
.report{background:var(--deep);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.report.done{border-left-color:var(--good)}
.report.banned{border-left-color:var(--muted)}
.report .meta{font-size:13px;color:var(--muted)}
.report .msg{background:var(--panel);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere}
.report .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:10px;padding:7px 12px;border:1px solid var(--volt);background:transparent;color:var(--volt);font-weight:700;font-size:13px}
.btn.danger{border-color:var(--rose);color:var(--rose)}
.btn.danger.armed{background:var(--rose);color:var(--abyss)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.ok{background:rgba(52,211,153,.14);color:var(--good)}
.pill.ban{background:rgba(255,95,168,.14);color:var(--rose)}
.pill.adm{background:rgba(46,230,255,.12);color:var(--volt)}
.pill.r-programmierer{background:rgba(255,201,77,.16);color:#FFC94D;border:1px solid #FFC94D}
.pill.r-admin{background:rgba(185,140,255,.16);color:#B98CFF;border:1px solid #B98CFF}
.pill.r-moderator{background:rgba(92,200,255,.16);color:#5CC8FF;border:1px solid #5CC8FF}
.team{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.team .tm{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:14px;background:var(--deep);border:1px solid var(--line);min-width:170px}
.team .tm b{font-size:15px}
.team .tm small{color:var(--muted);font-size:12px;word-break:break-all}
.search{width:100%;max-width:420px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--deep)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);padding:20px;text-align:center}
.card{max-width:440px;margin:40px auto 0;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.card input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .primary{background:var(--volt);color:var(--abyss);border:none;border-radius:12px;padding:11px;font-weight:700}
.note{font-size:13px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:10px 0 14px}
.kcard{background:var(--deep);border:1px solid var(--line);border-radius:12px;align-self:start}
.kcard>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard>summary::-webkit-details-marker{display:none}
.kcard>summary::before{content:"▸ ";color:var(--volt)}
.kcard[open]{grid-column:1/-1}
.kcard[open]>summary::before{content:"▾ "}
.kcard>.card{margin:0!important;max-width:none!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0 0 12px 12px!important}

/* ===== 0.45b: neues Panel – Seitenleiste, Unter-Reiter, Nutzer-Liste, Seitenfenster ===== */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:210px;flex:0 0 210px;box-sizing:border-box;padding:18px 12px;
  background:rgba(12,20,51,.85);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.side[hidden],.tab[hidden]{display:none!important}
.side .brand{padding:0 8px 6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:15px;position:relative}
.nav .tab i{font-style:normal;width:22px;text-align:center}
.nav .tab:hover{background:rgba(46,230,255,.06);color:var(--text)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--rose);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;box-sizing:border-box}
.badge.on{display:inline-flex}
.side #logout{margin-top:6px}
.wrap{flex:1;min-width:0;max-width:1180px}
.top{display:none}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:20;width:auto;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:6px}
  .side .brand{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav .tab{flex-direction:column;gap:2px;padding:6px 9px;font-size:11px;width:auto;text-align:center;white-space:nowrap}
  .nav .tab i{width:auto;font-size:18px}
  .badge{position:absolute;top:0;right:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .side #logout{margin:0 0 0 auto;font-size:12px;padding:6px 8px;white-space:nowrap}
  .side #who{display:none}
}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:16px 0 12px}
.ph h1{font-family:var(--f-brand);font-size:22px;margin:0}
.ph .sub{color:var(--muted);font-size:14px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.subnav button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--muted);font-weight:700;font-size:14px}
.subnav button[aria-pressed="true"]{color:var(--abyss);background:var(--volt);border-color:var(--volt)}
.subnav button .n{margin-left:6px;background:var(--rose);color:#fff;border-radius:9px;padding:0 6px;font-size:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
.cgrid>.card,.cgrid>.form,.cgrid>.chart{max-width:none;margin:0!important}
.cgrid>.card>b:first-child{font-size:15px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.wide{max-width:none;width:100%;box-sizing:border-box;margin:12px 0 0}
.card.wide input{flex:0 0 auto!important}
.card.wide .tiles6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cgrid .btn+.btn{margin-left:6px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--deep);border:1px solid var(--line);color:var(--text)}
.todo button:hover{border-color:var(--volt)}
.todo .ic{font-size:20px}
.todo .tx{flex:1}
.todo .tx small{display:block;color:var(--muted);font-size:12.5px}
.todo .go{color:var(--volt);font-weight:700;font-size:13px;white-space:nowrap}
.todo .red{border-left:4px solid var(--rose)} .todo .yel{border-left:4px solid var(--warn)} .todo .ok{border-left:4px solid var(--good)}
.tiles6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.tiles6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.planbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--panel);margin:8px 0 6px}
.planbar div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ulist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.urow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) 28px;gap:10px;align-items:center;padding:10px 14px;
  background:var(--deep);border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text);width:100%}
.urow:last-child{border-bottom:0}
.urow:hover{background:#101a40}
.urow.head{background:var(--abyss);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:default}
.urow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .nm small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .ch{color:var(--muted);font-size:20px;text-align:right}
@media (max-width:700px){.urow{grid-template-columns:minmax(0,1fr) auto 20px}.urow .c3,.urow .c4{display:none}.urow.head{display:none}}
.pill.free{background:rgba(52,211,153,.16);color:var(--good)}
.pill.prem{background:rgba(255,201,77,.16);color:#FFC94D}
.pill.vip{background:rgba(185,140,255,.18);color:#C9A6FF}
.pill.norm{background:rgba(141,156,201,.14);color:var(--muted)}
.pill.inv{background:rgba(251,191,36,.14);color:var(--warn)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(3,6,20,.6);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer .dp{width:min(520px,100%);height:100%;overflow:auto;background:var(--deep);border-left:1px solid var(--line);padding:18px 18px 40px;box-sizing:border-box}
.drawer .dh{display:flex;align-items:flex-start;gap:10px}
.drawer .dh h2{margin:0;font-family:var(--f-brand);font-size:20px}
.drawer .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;color:var(--muted);padding:4px 10px;font-size:18px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.facts div{background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.facts b{display:block;color:var(--text);font-size:14px;overflow-wrap:anywhere}
.dsec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dsec h3{margin:0 0 8px;font-size:14px;color:var(--volt)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--abyss);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.opt.on{border-color:var(--volt);background:rgba(46,230,255,.12);color:var(--volt)}
.opt.danger{border-color:var(--rose);color:var(--rose)}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:18px}
.svc a{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;background:var(--deep);border:1px solid var(--line);color:var(--text);text-decoration:none}
.svc a:hover{border-color:var(--volt)}
.svc a b{font-size:15px}
.svc a small{color:var(--muted);font-size:12.5px}
.svc a em{font-style:normal;font-size:12.5px;color:var(--good);font-weight:700}
.svc a em.pay{color:var(--warn)}

.err{color:var(--rose);font-size:13px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.form{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.form label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.form input,.form select,.form textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--text);font:inherit;min-width:0}
.form .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:none;padding:8px 14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:rgba(46,230,255,.12);color:var(--volt)}
.tile.good .v{color:var(--good)}
.tile.bad .v{color:var(--rose)}
.amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.in{color:var(--good)} .amt.out{color:var(--rose)}
.linkbtn{background:none;border:none;color:var(--volt);text-decoration:underline;padding:0;font-size:13px}
.doc{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.doc dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0}
.doc dt{color:var(--muted)} .doc dd{margin:0;overflow-wrap:anywhere}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
#print{display:none}
@media print{
  body{background:#fff!important;color:#000!important;background-image:none!important}
  .wrap{display:none!important}
  #print{display:block!important;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11pt;padding:0 8mm}
  #print h1{font-size:16pt;margin:0 0 4px} #print h2{font-size:12pt;margin:16px 0 6px;color:#000}
  #print table{width:100%;min-width:0;border-collapse:collapse} #print th,#print td{border:1px solid #999;padding:4px 6px;font-size:9.5pt;color:#000;background:#fff}
  #print .r{text-align:right} #print .small{font-size:9pt;color:#333}
  #print .sum td{font-weight:700}
}
</style>

<script>
/* ---------- Zustand ---------- */
const S = { mode:"setup", client:null, tab:"start", sub:{}, ufilter:"all", stats:null, reports:[], reportFilter:"offen", users:[], q:"", phone:null, armed:null,
  fin:[], year:new Date().getFullYear(), finKind:"ausgabe", authReqs:[], authPick:null, authResult:null, authQ:"" };
const CATS = {
  einnahme: ["App Store (Apple)", "Google Play", "Sonstige Einnahmen"],
  ausgabe: ["Server (Supabase)", "E-Mail-Versand", "Anrufe (LiveKit)", "KI-Dienste", "Apple Entwicklerkonto", "Google Play Konto",
            "Domain & Webseite", "Rechts- & Steuerberatung", "Hardware & Software", "Werbung", "Sonstige Ausgaben"]
};

async function rpc(name, params){
  if (S.mode === "demo") return demoRpc(name, params);
  const { data, error } = await S.client.rpc(name, params || {});
  if (error) throw new Error(error.message);
  return data;
}
function demoRpc(name, p){
  if (name === "admin_recurring_list") return S.demoRec || (S.demoRec = [
    { id:1, kind:"ausgabe", category:"Apple Entwicklerkonto", counterparty:"Apple", amount:99, currency:"USD", every:"jahr", day:1, month:1, active:true },
    { id:2, kind:"ausgabe", category:"Domain wuzzo.de", counterparty:"Domain-Anbieter", amount:12, currency:"EUR", every:"jahr", day:1, month:3, active:true }]);
  if (name === "admin_recurring_save"){ S.demoRec = S.demoRec || [];
    const x = S.demoRec.find(r => r.id === p.p_id);
    const v = { id:p.p_id || Date.now(), kind:p.p_kind, category:p.p_category, counterparty:p.p_counterparty, amount:p.p_amount, currency:p.p_currency, every:p.p_every, day:p.p_day, month:p.p_month, active:p.p_active };
    if (x) Object.assign(x, v); else S.demoRec.push(v); return v.id; }
  if (name === "admin_recurring_delete"){ S.demoRec = (S.demoRec || []).filter(r => r.id !== p.p_id); return null; }
  if (name === "admin_play_price_status") return { at:new Date().toISOString(), ok:["wuzzo_start 8,99 €","wuzzo_jahr 8,99 €","wuzzo_premium_6m 8,99 €","wuzzo_vip_6m 24,99 €"], bad:[] };
  if (name === "admin_store_reports") return { bucket:"pubsite_prod_1234567890", last_run:"Demo", last_error:"", refunds:1,
    reports:[{ month:"2026-11-01", gross:182.40, fees:-27.36, taxes:-34.66, refunds:-7.55, net:112.83 }, { month:"2026-10-01", gross:96.10, fees:-14.42, taxes:-18.26, refunds:0, net:63.42 }] };
  if (name === "admin_finance_settings") return { auto_book:"1", fee_google_pct:"15", fee_apple_pct:"15", usd_eur:"0.92", usd_auto:"1" };
  if (name === "admin_resolve_report"){
    const r = S.reports.find(x => x.report_id === p.p_report); if (r){ r.status = p.p_ban ? "gesperrt" : "erledigt"; if (p.p_ban){ const u = S.users.find(x => x.user_id === r.reported_id); if (u) u.banned = true; S.reports.forEach(x => { if (x.reported_id === r.reported_id) x.reported_banned = true; }); } }
    S.stats.reports_open = S.reports.filter(x => x.status === "offen").length;
  }
  if (name === "admin_set_banned"){ const u = S.users.find(x => x.user_id === p.p_user); if (u) u.banned = p.p_banned; }
  return null;
}

  renderBanner();

  if (S.mode === "login") return renderLogin(main);
  if (S.mode === "noadmin") return renderNoAdmin(main);

  else if (S.tab === "users") renderUsers(main);

  else if (S.tab === "system") renderSystem(main);

  else if (S.tab === "pay") renderPay(main);
  else if (S.tab === "launch") renderLaunch(main);
  else renderAuthority(main);
}
/* 📦 Kompakt: Alle Karten als zugeklappte Kacheln nebeneinander – ein Klick klappt sie auf. */
function compactCards(main){
  const cards = [...main.children].filter(el => el.classList && el.classList.contains("card"));
  if (!cards.length) return;
  const grid = $("div","kgrid");
  cards[0].before(grid);
  cards.forEach(c => {
    const d = document.createElement("details"); d.className = "kcard";
    const s = document.createElement("summary");
    const t = c.querySelector(":scope > b, :scope > h2, :scope > h3");
    s.textContent = t ? t.textContent : "Einstellungen";
    if (t){
      t.style.display = "none";
      try { new MutationObserver(() => { s.textContent = t.textContent; }).observe(t, { childList:true, characterData:true, subtree:true }); } catch(e){}
    }
    const key = "wz-k:" + S.tab + ":" + s.textContent.replace(/[0-9]+/g, "").slice(0, 30);
    try { if (sessionStorage.getItem(key) === "1") d.open = true; } catch(e){}
    d.addEventListener("toggle", () => { try { sessionStorage.setItem(key, d.open ? "1" : "0"); } catch(e){} });
    d.append(s, c);
    grid.append(d);
  });
}

function niceMax(m){ if (m <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(m))); for (const f of [1,2,2.5,5,10]) if (f*p >= m) return f*p; return 10*p; }
function barChart(title, unit, data, color){
  const box = $("div","chart"); box.append($("h3",null,title), $("div","sub", "Summe: " + nf(data.reduce((a,b) => a + b.v, 0)) + " " + unit));
  const W = 480, H = 170, L = 34, R = 6, T = 10, B = 22;
  const max = niceMax(Math.max(1, ...data.map(d => d.v)));
  const n = Math.max(1, data.length), slot = (W - L - R) / n, bw = Math.max(4, slot - 6);
  const y = v => T + (H - T - B) * (1 - v / max);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + title + '">';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, yy = y(v);
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"' + (i ? ' stroke-dasharray="2 4"' : '') + '/>';
    svg += '<text x="' + (L - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + nf(v) + '</text>'; }
  data.forEach((d, i) => {
    const x = L + i * slot + (slot - bw) / 2, yy = y(d.v), h = Math.max(0, H - B - yy), r = Math.min(4, bw / 2, h);
    const path = h > 0 ? 'M' + x + ',' + (H - B) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + yy + ' ' + (x + bw) + ',' + (yy + r) + 'V' + (H - B) + 'Z' : '';
    svg += '<path d="' + path + '" fill="' + color + '" opacity="' + (i === n - 1 ? 1 : .7) + '"/>';
    svg += '<rect data-i="' + i + '" x="' + (L + i * slot) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '" fill="transparent"/>';
    if (i % 3 === 0 || i === n - 1){ const dd = new Date(d.day); svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + dd.getDate() + '.' + (dd.getMonth() + 1) + '.</text>'; }
  });
  svg += '</svg>';
  box.insertAdjacentHTML("beforeend", svg);
  const tip = $("div","tip"); tip.hidden = true; box.append(tip);
  box.querySelectorAll("rect[data-i]").forEach(r => {
    const show = () => { const d = data[+r.dataset.i]; tip.textContent = new Date(d.day).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}) + ": " + nf(d.v);
      const bb = r.getBoundingClientRect(), pb = box.getBoundingClientRect(); tip.style.left = (bb.left - pb.left + bb.width / 2) + "px"; tip.style.top = (bb.top - pb.top + 8) + "px"; tip.hidden = false; };
    r.addEventListener("mouseenter", show); r.addEventListener("touchstart", show, { passive:true });
    r.addEventListener("mouseleave", () => tip.hidden = true);
  });
  return box;
}

function ago(d){
  if (!d) return "–";
  const m = Math.round((Date.now() - new Date(d)) / 60000);

/* ---------- 💶 Geld-Hilfen ---------- */
// Brutto → was bei dir ankommt: 19 % MwSt raus, dann 15 % Google
function netOf(cents){ return (Number(cents || 0) / 100) / 1.19 * 0.85; }
function monatsKosten(){
  const h = S.home || {}, F = fixKosten(), m = S.money || {};
  const ai = Number(m.ai_usd_month ?? h.ai_usd_month ?? 0) * 0.92, sms = Number(m.sms_month ?? h.sms_month ?? 0) * 0.08;
  return { fix: F.supabase + F.livekit + F.domain, ai, sms, sum: F.supabase + F.livekit + F.domain + ai + sms };
}
function ampel(){
  const m = S.money || {}, k = monatsKosten();
  const ein = netOf(m.revenue_month_cents);
  // Plus seit Start: alle Einnahmen netto – Fixkosten je Monat seit dem ersten Kauf – KI – SMS
  const start = m.first_purchase ? new Date(m.first_purchase) : new Date();
  const monate = Math.max(1, (new Date().getFullYear() - start.getFullYear()) * 12 + new Date().getMonth() - start.getMonth() + 1);
  const plus = netOf(m.revenue_total_cents) - k.fix * monate - Number(m.ai_usd_total || 0) * 0.92 - Number(m.sms_total || 0) * 0.08;
  // ⚪ Testphase: Bezahlen aus und noch nie etwas verkauft → keine rote Warnung
  const test = !m.pay_on && !Number(m.revenue_total_cents || 0);
  const lvl = test ? "test" : k.sum > ein ? "red" : k.sum > ein * 0.8 ? "yel" : "ok";
  return { lvl, ein, kosten: k, erg: ein - k.sum, plus, goal: Number(m.reserve_goal_eur || 3000), monate };
}

    $("p","note","Alles automatisch: Käufe aus Google Play (und später Apple App Store), KI, SMS und deine festen Kosten – dazu alles, was du selbst in der Buchhaltung einträgst. Netto = nach Mehrwertsteuer und Store-Gebühr."));
  const bar = $("div"); bar.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin:6px 0";
  Object.entries(U).forEach(([k, [t]]) => { const b = $("button","btn" + (S.flowUnit === k ? "" : " ghost"), t === "Tag" ? "📅 Täglich" : t === "Woche" ? "🗓️ Wöchentlich" : t === "Monat" ? "📆 Monatlich" : "🗃️ Jährlich");
    if (S.flowUnit === k) b.style.cssText = "background:var(--volt);color:#060a1f"; b.onclick = () => { S.flowUnit = k; render(); }; bar.append(b); });
  head.append(bar); main.append(head);

  const [, cnt] = U[S.flowUnit];
  rpc("admin_finance_series", { p_unit: S.flowUnit, p_count: cnt }).then(rows => {
    box.replaceChildren(); rows = rows || [];
    const num = v => Number(v || 0);
    const ein = r => num(r.einnahmen_netto) + num(r.sonstige_einnahmen);
    const aus = r => num(r.ki) + num(r.sms) + num(r.feste_kosten) + num(r.sonstige_ausgaben);
    const sum = f => rows.reduce((a, r) => a + f(r), 0);
    const E = sum(ein), A = sum(aus), R = E - A;
    const t = $("div","tiles6"); t.style.marginTop = "12px";
    const tile = (k, v, s2, cls) => { const x = $("div","tile" + (cls ? " " + cls : "")); x.append($("div","k",k), $("div","v",v)); if (s2) x.append($("div","s",s2)); t.append(x); };
    const zeitraum = rows.length ? fmtDate(rows[0].start) + " – " + fmtDate(rows[rows.length - 1].ende) : "";
    tile("💰 Einnahmen (netto)", eur(E), "Verkäufe brutto " + eur(sum(r => num(r.google_brutto) + num(r.apple_brutto))) + " · " + nf(sum(r => num(r.kaeufe))) + " Käufe");
    tile("💸 Ausgaben", eur(A), "fest " + eur(sum(r => num(r.feste_kosten))) + " · KI " + eur(sum(r => num(r.ki))) + " · SMS " + eur(sum(r => num(r.sms))) + " · sonst " + eur(sum(r => num(r.sonstige_ausgaben))));
    tile("📈 Ergebnis", eur(R), zeitraum, R >= 0 ? "good" : "bad");

    tile("🧾 Mehrwertsteuer", eur(sum(r => num(r.mwst))), "führen Google/Apple für dich ab");
    box.append(t);

        .map(v => String(v).replace(".", ",")).join(";")));
      const blob = new Blob(["﻿" + lines.join("\n")], { type:"text/csv;charset=utf-8" });

function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n);

  c.append($("b",null,"🧮 Was bleibt übrig?"), $("p","note","Zahlen ändern – das Ergebnis rechnet sich sofort neu. Preise: Pass " + pe("wuzzo_start") + " / " + pe("wuzzo_jahr") + ", Premium " + pe("wuzzo_premium_6m") + ", VIP " + pe("wuzzo_vip_6m") + " (ändern unter 🏷️ Preise & Grenzen). Alles Schätzungen."));
  const felder = [["users","👥 Nutzer gesamt",""],["aktiv","🟢 davon aktiv im Monat","%"],["prem","⭐ kaufen Premium","%"],["vip","👑 kaufen VIP","%"],
    ["neu","🆕 neue Nutzer pro Monat",""],["verl","🔄 verlängern den Pass","%"],["anruf","📞 der Aktiven telefonieren","%"],["video","🎥 davon per Video","%"]];
  const out = $("div"); out.style.marginTop = "10px";
  const calc = () => {
    try { localStorage.setItem("wz_rechner", JSON.stringify(C)); } catch(e){}
    const n = (b) => b / 1.19 * 0.85;
    const aktiv = C.users * C.aktiv / 100;
    const premK = C.users * C.prem / 100, vipK = C.users * C.vip / 100;
    const passZahler = Math.max(0, C.users - premK - vipK);
    const ein = { neu: C.neu * n(preis("wuzzo_start")), verl: passZahler * C.verl / 100 * n(preis("wuzzo_jahr")) / 12, prem: premK * n(preis("wuzzo_premium_6m")) / 6, vip: vipK * n(preis("wuzzo_vip_6m")) / 6 };
    const sumE = ein.neu + ein.verl + ein.prem + ein.vip;
    const supa = fixKosten().supabase + (aktiv > 3000 ? 50 : aktiv > 500 ? 14 : 0) + aktiv * 0.007;
    const min = aktiv * C.anruf / 100 * 60 * 2;
    const lk = min <= 5000 ? 0 : 46 + Math.max(0, min - 150000) * 0.00046 + min * C.video / 100 * 0.011 * 0.11;
    const ki = aktiv * 0.005, dg = aktiv * C.prem / 100 * 0.04, mail = aktiv > 8000 ? 9 : 0;
    const aus = { "Supabase": supa, "LiveKit (Anrufe)": lk, "Claude-KI": ki, "Deepgram": dg, "Brevo": mail, "Domain": 1 };
    const sumA = Object.values(aus).reduce((a, b) => a + b, 0);
    out.innerHTML = "";
    const t = $("div","tiles6");
    const tile = (k, v, s2, cls) => { const x = $("div","tile" + (cls ? " " + cls : "")); x.append($("div","k",k), $("div","v",v)); if (s2) x.append($("div","s",s2)); t.append(x); };
    tile("💰 Einnahmen / Monat", eur(sumE), "Neue " + eur(ein.neu) + " · Verlängern " + eur(ein.verl) + " · ⭐ " + eur(ein.prem) + " · 👑 " + eur(ein.vip));
    tile("💸 Ausgaben / Monat", eur(sumA), Object.entries(aus).filter(([,v]) => v > 0.5).map(([k,v]) => k + " " + eur(v)).join(" · "));
    tile("📈 Bleibt übrig / Monat", eur(sumE - sumA), "vor Steuern", sumE - sumA >= 0 ? "good" : "bad");
    tile("📅 Pro Jahr", eur((sumE - sumA) * 12), "davon ca. 30 % Steuer zurücklegen");
    tile("👤 Pro aktivem Nutzer", eur((sumE - sumA) / Math.max(1, aktiv)) , "Plus pro Monat");
    out.append(t);
  };
  const grid2 = $("div"); grid2.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px";
  felder.forEach(([k, t, unit]) => {
    const l = $("label"); l.style.cssText = "display:flex;flex-direction:column;gap:4px;font-size:13px";
    const i2 = document.createElement("input"); i2.type = "number"; i2.min = "0"; i2.value = C[k]; i2.style.cssText = IN_STYLE;
    i2.oninput = () => { C[k] = Math.max(0, Number(i2.value) || 0); calc(); };
    l.append($("span",null,t + (unit ? " (" + unit + ")" : "")), i2); grid2.append(l);
  });
  c.append(grid2, out); main.append(c); calc();
}

    { id:"broadcast", t:"📢 Nachricht an alle", need:"admin" },

// 🚦 Ampel pro Zahlung: rot = jetzt bezahlen · gelb = bald / prüfen · grün = erledigt · grau = gerade nichts zu tun
const PAY_ALERT = { sms:"guthaben_sms", ki:"guthaben_anthropic", dg:"guthaben_deepgram" };
function payStatus(z, st){
  const [id,,,,, oft, bis] = z; const heute = new Date(); const d = st[id] ? new Date(st[id]) : null;
  const tage = x => Math.ceil((x - heute) / 864e5);
  if (oft === "einmal") return { lvl:"gruen", txt:"erledigt" };
  if (oft === "spaeter") return { lvl:"grau", txt:"noch nicht nötig" };
  if (oft === "auffuellen"){
    const a = (S.alerts || []).find(x => x.kind === PAY_ALERT[id]);
    if (a) return { lvl: a.level === "rot" ? "rot" : "gelb", txt: a.level === "rot" ? "Guthaben leer – jetzt aufladen!" : "Guthaben wird knapp – bald aufladen" };
    return { lvl:"gruen", txt:"Guthaben reicht – Wuzzo warnt dich rechtzeitig" };
  }
  if (oft === "bescheid") return d ? { lvl:"gruen", txt:"bezahlt am " + d.toLocaleDateString("de-DE") } : { lvl:"grau", txt:"wartet auf Bescheid/Rechnung" };
  if (oft === "jahr"){
    if (d && heute - d < 335 * 864e5) return { lvl:"gruen", txt:"bezahlt am " + d.toLocaleDateString("de-DE") };
    if (d && heute - d < 365 * 864e5) return { lvl:"gelb", txt:"Verlängerung bald fällig" };
    return { lvl:"gelb", txt: d ? "Jahr ist um – bitte prüfen" : "einmal prüfen und „Bezahlt“ klicken" };
  }
  // monatlich
  if (d && d.getMonth() === heute.getMonth() && d.getFullYear() === heute.getFullYear()) return { lvl:"gruen", txt:"diesen Monat bezahlt (" + d.toLocaleDateString("de-DE") + ")" };
  if (bis && !d){
    const t = tage(new Date(bis));
    if (t < 0) return { lvl:"rot", txt:"überfällig seit " + new Date(bis).toLocaleDateString("de-DE") + "!" };
    if (t <= 21) return { lvl: t <= 5 ? "rot" : "gelb", txt:"noch " + t + " Tag" + (t === 1 ? "" : "e") + " – bis " + new Date(bis).toLocaleDateString("de-DE") };
    return { lvl:"gruen", txt:"noch Zeit bis " + new Date(bis).toLocaleDateString("de-DE") };
  }
  return heute.getDate() <= 10 ? { lvl:"gelb", txt:"neuer Monat – Abbuchung/Rechnung prüfen" } : { lvl:"rot", txt:"diesen Monat noch nicht abgehakt" };
}

function copyText(t, btn){
  const ok = () => { const o = btn.textContent; btn.textContent = "✅ Kopiert"; setTimeout(() => btn.textContent = o, 1500); };
  try { navigator.clipboard.writeText(t).then(ok, () => fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta = document.createElement("textarea"); ta.value = t; document.body.append(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch(e){} ta.remove(); }
}

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => { prompt("Bitte kopieren (Strg+C):", t); });
  else prompt("Bitte kopieren (Strg+C):", t);
}

function versionCell(u){
  const echte = (S.users || []).filter(x => x.display_name && x.display_name !== "Wuzzo Bot");
  const neueste = Math.max(0, ...echte.map(x => x.app_build || 0));
  const td = $("td");
  if (u.display_name === "Wuzzo Bot"){ td.textContent = "–"; return td; }
  let ico = "🔴", txt = "alt / unbekannt";
  if (u.app_build && u.app_build >= neueste){ ico = "🟢"; txt = u.app_version || ("Build " + u.app_build); }
  else if (u.app_build){ ico = "🟡"; txt = u.app_version || ("Build " + u.app_build); }
  td.textContent = ico + " " + txt;
  if (u.app_seen_at) td.title = "Zuletzt geöffnet: " + fmtDate(u.app_seen_at);
  return td;
}

async function openReceipt(e){
  if (S.mode === "demo"){ alertNote("In der Demo gibt es keine echten Belege."); return; }
  const { data, error } = await S.client.storage.from("belege").createSignedUrl(e.receipt_path, 300);

}
function esc(t){ const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
function printEUR(){
  const list = [...yearEntries()].sort((a,b) => String(a.booked_on).localeCompare(String(b.booked_on)));
  const byCat = kind => { const m = {}; list.filter(e => e.kind === kind).forEach(e => m[e.category] = (m[e.category] || 0) + Number(e.amount)); return m; };
  const inc = sumBy(list,"einnahme"), out = sumBy(list,"ausgabe");
  let h = "<h1>Einnahmen-Überschuss-Rechnung " + S.year + " – Wuzzo</h1>";
  h += '<p class="small">Name: ______________________ &nbsp; Steuernummer: ______________________ &nbsp; Erstellt am ' + new Date().toLocaleDateString("de-DE") + "</p>";
  const catTable = (title, m, total) => { let t = "<h2>" + title + "</h2><table><tr><th>Kategorie</th><th class=\"r\">Betrag brutto</th></tr>";
    Object.keys(m).sort().forEach(k => t += "<tr><td>" + esc(k) + '</td><td class="r">' + eur(m[k]) + "</td></tr>");
    return t + '<tr class="sum"><td>Summe</td><td class="r">' + eur(total) + "</td></tr></table>"; };
  h += catTable("Betriebseinnahmen", byCat("einnahme"), inc) + catTable("Betriebsausgaben", byCat("ausgabe"), out);
  h += '<h2>Ergebnis</h2><table><tr class="sum"><td>' + (inc - out >= 0 ? "Gewinn" : "Verlust") + '</td><td class="r">' + eur(inc - out) + "</td></tr></table>";
  h += "<h2>Belegliste</h2><table><tr><th>Nr.</th><th>Datum</th><th>Art</th><th>Kategorie</th><th>Beschreibung</th><th>Gegenpartei</th><th class=\"r\">Brutto</th><th class=\"r\">USt %</th><th class=\"r\">davon USt</th><th>Beleg</th></tr>";
  list.forEach((e, i) => h += "<tr><td>" + (i + 1) + "</td><td>" + fmtDate(e.booked_on) + "</td><td>" + (e.kind === "einnahme" ? "Einnahme" : "Ausgabe") + "</td><td>" + esc(e.category) + "</td><td>" + esc(e.description) + "</td><td>" + esc(e.counterparty) + '</td><td class="r">' + eur(e.amount) + '</td><td class="r">' + Number(e.vat_rate) + '</td><td class="r">' + eur(vatOf(e)) + "</td><td>" + (e.receipt_path ? "ja" : "fehlt") + "</td></tr>");
  h += "</table><p class=\"small\">Vorlage für die Anlage EÜR (Abgabe über ELSTER). Beträge brutto. Keine Steuerberatung.</p>";
  document.getElementById("print").innerHTML = h;
  window.print();
}

    const tr = $("tr");
    tr.append($("td",null,String(r.id)), $("td",null,fmtDate(r.received_on)), $("td",null,r.authority), $("td",null,r.case_number), $("td",null,r.user_phone || "–"), $("td",null,r.disclosed_at ? fmtTime(r.disclosed_at) : "–"));
    const a = $("td"); const b = $("button","linkbtn","anzeigen"); b.onclick = () => { S.authResult = r; render(); window.scrollTo(0, 0); }; a.append(b); tr.append(a);
    tb.append(tr);
  });
  t.append(tb); w.append(t); main.append(w);
}
function authHtml(r){
  const d = r.disclosed || {}, k = d.konto || {}, n = d.nutzung || {}, msgs = d.gemeldete_nachrichten || [];
  let h = "<h1>Auskunft an " + esc(r.authority) + "</h1>";
  h += '<p class="small">Aktenzeichen: ' + esc(r.case_number) + " · Eingang: " + fmtDate(r.received_on) + " · Rechtsgrundlage: " + esc(r.legal_basis || "–") + " · Interne Nr. " + r.id + " · Erstellt: " + (r.disclosed_at ? fmtTime(r.disclosed_at) : "–") + "</p>";
  h += "<h2>Kontodaten</h2><table>" + [["Telefonnummer", k.telefonnummer], ["Anzeigename", k.anzeigename], ["Statustext", k.status_text], ["Registriert am", k.registriert_am ? fmtTime(k.registriert_am) : "–"], ["Konto gesperrt", k.gesperrt ? "ja" : "nein"]]
    .map(([a,b]) => "<tr><td>" + a + "</td><td>" + esc(b || "–") + "</td></tr>").join("") + "</table>";
  h += "<h2>Nutzungsdaten</h2><table>" + [["Einzelchats", n.einzelchats], ["Gruppen", n.gruppen], ["Letzte Aktivität", n.letzte_aktivitaet ? fmtTime(n.letzte_aktivitaet) : "–"]]
    .map(([a,b]) => "<tr><td>" + a + "</td><td>" + esc(b == null ? "–" : b) + "</td></tr>").join("") + "</table>";
  h += "<h2>Von anderen Nutzern gemeldete Nachrichten</h2>";
  h += msgs.length ? "<table><tr><th>Gesendet</th><th>Gemeldet</th><th>Grund</th><th>Nachricht</th></tr>" + msgs.map(m => "<tr><td>" + (m.gesendet_am ? fmtTime(m.gesendet_am) : "–") + "</td><td>" + fmtTime(m.gemeldet_am) + "</td><td>" + esc(m.grund) + "</td><td>" + esc(m.nachricht || "(gelöscht)") + "</td></tr>").join("") + "</table>" : "<p>Keine.</p>";
  h += '<p class="small">Private Nachrichten sind Ende-zu-Ende-verschlüsselt und für den Betreiber nicht lesbar. Diese Auskunft enthält nur die beim Betreiber vorhandenen Konto- und Nutzungsdaten sowie Nachrichten, die von anderen Nutzern gemeldet wurden.</p>';
  h += '<p class="small">Ort, Datum, Unterschrift: _______________________________________</p>';
  return h;
}
function authDoc(r, withPrint){
  const box = $("div","doc");
  box.innerHTML = authHtml(r).replace(/<h1>/g, "<h3>").replace(/<\/h1>/g, "</h3>").replace(/<h2>/g, "<h4>").replace(/<\/h2>/g, "</h4>").replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
  if (withPrint){
    const b = $("button","btn","Auskunft drucken / als PDF");
    b.onclick = () => { if (S.mode === "demo"){ alertNote("Drucken geht in der Datei wuzzo-admin-lokal.html auf deinem PC."); return; } document.getElementById("print").innerHTML = authHtml(r); window.print(); };
    box.append(b);
  }
  return box;
}

/* ---------- Verbinden & Anmelden ---------- */
function renderSetup(main){
  const c = $("form","card");
  c.append($("h2",null,"Mit deiner Wuzzo-Datenbank verbinden"),
    $("p","note","Die Werte findest du in Supabase unter Project Settings → API. Sie werden nur in diesem Browser gespeichert."));
  const l1 = $("label",null,"Project URL"); const i1 = $("input"); i1.id = "cfg-url"; i1.placeholder = "https://xyz.supabase.co"; l1.append(i1);
  const l2 = $("label",null,"anon public Key"); const i2 = $("input"); i2.id = "cfg-key"; i2.placeholder = "eyJ…"; l2.append(i2);
  const cfg = getCfg(); if (cfg){ i1.value = cfg.url; i2.value = cfg.key; } else { i1.value = "https://hbusxiioorpsskzvjxza.supabase.co"; }
  const go = $("button","primary","Verbinden"); go.type = "submit";
  const err = $("p","err"); err.id = "cfg-err";
  c.append(l1, l2, go, err);
  c.onsubmit = e => { e.preventDefault();
    const url = i1.value.trim(), key = i2.value.trim();
    if (!/^https:\/\/.+\.supabase\.co\/?$/.test(url) || key.length < 20){ err.textContent = "Bitte eine gültige Project URL und den anon-Schlüssel eintragen."; return; }
    setCfg({ url, key }); connect();
  };
  main.append(c);
}
function renderLogin(main){
  const c = $("form","card");
  c.append($("h2",null,"Admin-Anmeldung"), $("p","note", S.phone ? "Gib den Code aus der E-Mail an " + S.phone + " ein (auch im Spam-Ordner nachsehen)." : "Melde dich mit derselben E-Mail-Adresse an wie in der App."));
  const lab = $("label",null, S.phone ? "Code aus der E-Mail" : "E-Mail-Adresse");
  const inp = $("input"); inp.id = S.phone ? "otp" : "email"; inp.placeholder = S.phone ? "123456" : "name@beispiel.de"; inp.inputMode = S.phone ? "numeric" : "email"; if (!S.phone) inp.type = "email"; lab.append(inp);
  const go = $("button","primary", S.phone ? "Anmelden" : "Code senden"); go.type = "submit";
  const err = $("p","err");
  c.append(lab, go);
  if (S.phone){ const other = $("button","ghost","Andere E-Mail"); other.type = "button"; other.onclick = () => { S.phone = null; render(); }; c.append(other); }
  const reset = $("button","ghost","Andere Datenbank verbinden"); reset.type = "button"; reset.onclick = () => { S.mode = "setup"; render(); };
  c.append(reset, err);
  c.onsubmit = async e => { e.preventDefault(); go.disabled = true; err.textContent = "";
    try {
      if (!S.phone){
        const m = inp.value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){ err.textContent = "Bitte eine gültige E-Mail-Adresse eingeben."; go.disabled = false; return; }
        const { error } = await S.client.auth.signInWithOtp({ email:m, options:{ shouldCreateUser:false } }); if (error) throw error;
        S.phone = m; render();
      } else {
        const { error } = await S.client.auth.verifyOtp({ email:S.phone, token:inp.value.trim(), type:"email" }); if (error) throw error;
        await afterLogin();
      }
    } catch(ex){ err.textContent = "Fehler: " + (ex.message || ex); go.disabled = false; }
  };
  main.append(c);
}
function renderNoAdmin(main){
  const c = $("div","card");
  c.append($("h2",null,"🔒 Kein Zugang"), $("p","note","Dieser Bereich ist nur für den Wuzzo-Programmierer. Du wurdest abgemeldet."));
  const out = $("button","ghost","Zurück"); out.onclick = () => { S.mode = "login"; render(); }; c.append(out); main.append(c);
}

async function connect(){
  const cfg = getCfg();
  if (!cfg || !window.supabase){ S.mode = "setup"; render(); return; }
  try { S.client = window.supabase.createClient(cfg.url, cfg.key); }
  catch(e){ S.mode = "setup"; render(); return; }
  const { data } = await S.client.auth.getSession();
  if (data && data.session) await afterLogin(); else { S.mode = "login"; render(); }
}
async function afterLogin(){
  try {
    const admin = await S.client.rpc("is_admin");
    if (admin.error || admin.data !== true){ S.mode = "noadmin"; render(); return; }
    const r = await S.client.rpc("admin_role"); S.role = r.error ? null : r.data;
    // 🔒 Das Panel ist NUR für den Programmierer – alle anderen kommen nicht hinein
    if (S.role !== "programmierer"){ S.mode = "noadmin"; try { await S.client.auth.signOut(); } catch(e){} render(); return; }
    S.mode = "live"; S.tab = "start"; await loadAll(); render();
  } catch(e){ S.mode = "login"; render(); alertNote("Verbindung fehlgeschlagen. Prüfe URL und Schlüssel."); }
}
async function logout(){
  if (S.client) { try { await S.client.auth.signOut(); } catch(e){} }
  S.phone = null; S.mode = "login"; render();
}

document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (t){ S.tab = t.dataset.tab; S.armed = null; if (t.dataset.tab === "users") S.ufilter = S.ufilter || "all"; render(); window.scrollTo(0,0); }
});
document.getElementById("logout").onclick = () => { if (S.mode === "demo"){ S.mode = "setup"; render(); } else logout(); };

if (getCfg()) connect(); else render();
</script>

<!-- 🔒 Wuzzo-Schutz: kein Rechtsklick-Fenster, kein Kopieren, kein Drucken, keine Entwickler-Tasten -->
<style id="wz-schutz">
  html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
  img,a{-webkit-user-drag:none}
</style>
<script id="wz-schutz-js">
(function(){
  var frei = function(e){ var t = e.target; return t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]'); };
  ['contextmenu','dragstart'].forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }, true); });
  ['copy','cut','selectstart'].forEach(function(n){ document.addEventListener(n, function(e){ if (!frei(e)) e.preventDefault(); }, true); });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    var weg = k === 'f12'
      || (c && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 'k'))
      || (c && (k === 'u' || k === 's' || k === 'p'))
      || (c && (k === 'c' || k === 'x' || k === 'a') && !frei(e));
    if (weg){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
