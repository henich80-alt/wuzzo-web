<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Wuzzo holen</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060a1f;color:#eaf1ff;font-family:system-ui,Segoe UI,sans-serif;padding:20px 16px;box-sizing:border-box}
  .box{max-width:460px;width:100%;text-align:center}
  b.logo{font-size:30px;letter-spacing:.04em} b.logo span{color:#2ee6ff}
  h1{font-size:20px;margin:14px 0 6px}
  p{color:#8d9cc9;margin:6px 0}
  ol{text-align:left;margin:16px 0;padding:0;list-style:none;counter-reset:s}
  ol li{counter-increment:s;background:#0e1636;border:1px solid #1f2b5c;border-radius:14px;padding:12px 14px 12px 52px;margin:8px 0;position:relative;line-height:1.4}
  ol li::before{content:counter(s);position:absolute;left:12px;top:11px;width:28px;height:28px;border-radius:50%;background:#2ee6ff;color:#060a1f;font-weight:800;display:flex;align-items:center;justify-content:center}
  .en{display:inline-block;background:#1a73e8;color:#fff;border-radius:6px;padding:1px 7px;font-weight:700;white-space:nowrap}
  a.go{display:block;margin-top:14px;padding:15px 22px;border-radius:30px;background:#2ee6ff;color:#060a1f;font-weight:800;text-decoration:none;font-size:17px}
  .hint{font-size:13px;margin-top:12px}
  #wz-weiter{display:none}
</style>
<script>
  // =====================================================================
  // WUZZO – immer der richtige Download-Link (ab 0.46)
  // Der QR-Code auf wuzzo.de zeigt IMMER hierher (https://wuzzo.de/app/).
  // Wechselt Wuzzo vom Test in den Play Store, ändert sich nur diese Liste –
  // QR-Codes, Einladungen und Webseite bleiben gleich.
  // Von oben nach unten: das erste Datum, das schon erreicht ist, gilt.
  // =====================================================================
  var PLAN = [
    // ["2026-12-15", "https://play.google.com/store/apps/details?id=de.wuzzo.wuzzo"], // 🎉 für alle (Datum eintragen, sobald Google freigibt)
    ["2026-11-27", "https://play.google.com/apps/testing/de.wuzzo.wuzzo"],            // 🧪 geschlossener Test (Tester-Liste)
    ["2000-01-01", "https://play.google.com/apps/internaltest/4700548647227979651"]  // 🔒 interner Test (bis 26.11.)
  ];
  var heute = new Date().toISOString().slice(0, 10), ziel = PLAN[PLAN.length - 1][1];
  for (var i = 0; i < PLAN.length; i++) { if (heute >= PLAN[i][0]) { ziel = PLAN[i][1]; break; } }
  // 🌍 Sprache des Besuchers
  var sp = "de";
  try { sp = (new URLSearchParams(location.search).get("l") || localStorage.getItem("wz_lang") || navigator.language || "de"); } catch (e) { sp = navigator.language || "de"; }
  sp = String(sp).slice(0, 2).toLowerCase();
  if (["de","uk","ru","en","pl","tr","es","fr","it","pt"].indexOf(sp) < 0) sp = "en";
  ziel += (ziel.indexOf("?") < 0 ? "?" : "&") + "hl=" + sp;
  // 🎉 Im Play Store (für alle) gibt es Google auf allen Sprachen → sofort weiter.
  // 🧪 Die Tester-Seite von Google gibt es NUR auf Englisch → erst kurz erklären (ab 0.51).
  var TEST = ziel.indexOf("/apps/testing") > 0 || ziel.indexOf("/internaltest/") > 0;
  if (!TEST) location.replace(ziel);
</script>
</head>
<body>
  <div class="box" id="wz-weiter">
    <b class="logo">WU<span>ZZ</span>O</b>
    <h1 id="t1"></h1>
    <p id="t2"></p>
    <ol>
      <li id="s1"></li>
      <li id="s2"></li>
      <li id="s3"></li>
    </ol>
    <a class="go" id="go" href="https://play.google.com/apps/testing/de.wuzzo.wuzzo"></a>
    <p class="hint" id="t3"></p>
  </div>
<script>
(function(){
  var B1 = '<span class="en">Become a tester</span>', B2 = '<span class="en">Download it on Google Play</span>';
  var T = {
    de: ["Wuzzo testen – so geht's", "Wuzzo ist gerade im Test. Die nächste Seite kommt von Google und ist nur auf Englisch – das ist normal.",
         "Tippe unten auf den großen Knopf.", "Tippe auf der Google-Seite auf " + B1 + " (= Tester werden).", "Tippe dann auf " + B2 + " und installiere Wuzzo.",
         "▶️ Weiter zu Google Play", "Wichtig: mit dem Google-Konto, das auch im Play Store auf deinem Handy ist. Kostenlos."],
    en: ["How to test Wuzzo", "Wuzzo is in testing right now. The next page is from Google.",
         "Tap the big button below.", "On the Google page, tap " + B1 + ".", "Then tap " + B2 + " and install Wuzzo.",
         "▶️ Continue to Google Play", "Important: use the same Google account as the Play Store on your phone. Free."],
    uk: ["Як протестувати Wuzzo", "Wuzzo зараз у тестуванні. Наступна сторінка від Google лише англійською – це нормально.",
         "Натисніть велику кнопку нижче.", "На сторінці Google натисніть " + B1 + " (= стати тестувальником).", "Потім натисніть " + B2 + " і встановіть Wuzzo.",
         "▶️ Далі до Google Play", "Важливо: той самий Google-акаунт, що й у Play Маркеті на телефоні. Безкоштовно."],
    ru: ["Как протестировать Wuzzo", "Wuzzo сейчас в тестировании. Следующая страница от Google только на английском – это нормально.",
         "Нажмите большую кнопку внизу.", "На странице Google нажмите " + B1 + " (= стать тестировщиком).", "Затем нажмите " + B2 + " и установите Wuzzo.",
         "▶️ Дальше в Google Play", "Важно: тот же Google-аккаунт, что и в Play Маркете на телефоне. Бесплатно."],
    pl: ["Jak testować Wuzzo", "Wuzzo jest teraz w testach. Następna strona Google jest tylko po angielsku – to normalne.",
         "Dotknij dużego przycisku poniżej.", "Na stronie Google dotknij " + B1 + " (= zostań testerem).", "Potem dotknij " + B2 + " i zainstaluj Wuzzo.",
         "▶️ Dalej do Google Play", "Ważne: to samo konto Google co w Sklepie Play na telefonie. Za darmo."],
    tr: ["Wuzzo nasıl test edilir", "Wuzzo şu anda test aşamasında. Sonraki Google sayfası yalnızca İngilizce – bu normal.",
         "Aşağıdaki büyük düğmeye dokun.", "Google sayfasında " + B1 + " düğmesine dokun (= test kullanıcısı ol).", "Sonra " + B2 + " düğmesine dokun ve Wuzzo'yu yükle.",
         "▶️ Google Play'e devam et", "Önemli: telefonundaki Play Store ile aynı Google hesabı. Ücretsiz."],
    es: ["Cómo probar Wuzzo", "Wuzzo está en pruebas. La siguiente página de Google solo está en inglés; es normal.",
         "Toca el botón grande de abajo.", "En la página de Google, toca " + B1 + " (= ser probador).", "Luego toca " + B2 + " e instala Wuzzo.",
         "▶️ Ir a Google Play", "Importante: la misma cuenta de Google que en Play Store de tu móvil. Gratis."],
    fr: ["Comment tester Wuzzo", "Wuzzo est en test. La page suivante de Google est uniquement en anglais – c'est normal.",
         "Appuie sur le grand bouton ci-dessous.", "Sur la page Google, appuie sur " + B1 + " (= devenir testeur).", "Puis appuie sur " + B2 + " et installe Wuzzo.",
         "▶️ Continuer vers Google Play", "Important : le même compte Google que sur le Play Store de ton téléphone. Gratuit."],
    it: ["Come provare Wuzzo", "Wuzzo è in fase di test. La pagina successiva di Google è solo in inglese: è normale.",
         "Tocca il pulsante grande qui sotto.", "Sulla pagina di Google tocca " + B1 + " (= diventa tester).", "Poi tocca " + B2 + " e installa Wuzzo.",
         "▶️ Vai a Google Play", "Importante: lo stesso account Google del Play Store sul telefono. Gratis."],
    pt: ["Como testar o Wuzzo", "O Wuzzo está em teste. A próxima página do Google é só em inglês – é normal.",
         "Toque no botão grande abaixo.", "Na página do Google, toque em " + B1 + " (= tornar-se testador).", "Depois toque em " + B2 + " e instale o Wuzzo.",
         "▶️ Continuar para o Google Play", "Importante: a mesma conta Google da Play Store do seu telemóvel. Grátis."]
  };
  var t = T[sp] || T.en, ids = ["t1","t2","s1","s2","s3","go","t3"];
  document.documentElement.lang = sp;
  for (var i = 0; i < ids.length; i++) document.getElementById(ids[i]).innerHTML = t[i];
  document.getElementById("go").href = ziel;
  document.getElementById("wz-weiter").style.display = "block";
})();
</script>
<!-- 🔒 Wuzzo-Schutz: kein Rechtsklick-Fenster, kein Kopieren, kein Drucken, keine Entwickler-Tasten -->
<style id="wz-schutz">
  html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
  img,a{-webkit-user-drag:none}
  @media print{body{display:none!important}}
</style>
<script id="wz-schutz-js">
(function(){
  var frei = function(e){ var t = e.target; return t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]'); };
  ['contextmenu','dragstart'].forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }, true); });
  ['copy','cut','selectstart'].forEach(function(n){ document.addEventListener(n, function(e){ if (!frei(e)) e.preventDefault(); }, true); });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    var weg = k === 'f12'
      || (c && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 'k'))
      || (c && (k === 'u' || k === 's' || k === 'p'))
      || (c && (k === 'c' || k === 'x' || k === 'a') && !frei(e));
    if (weg){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
