<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Wuzzo holen</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060a1f;color:#eaf1ff;font-family:system-ui,Segoe UI,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:30px;background:#2ee6ff;color:#060a1f;font-weight:800;text-decoration:none}
  b{font-size:30px;letter-spacing:.04em} b span{color:#2ee6ff}
  p{color:#8d9cc9}
</style>
<script>
  // =====================================================================
  // WUZZO – immer der richtige Download-Link (ab 0.46)
  // Der QR-Code auf wuzzo.de zeigt IMMER hierher (https://wuzzo.de/app/).
  // Wechselt Wuzzo vom Test in den Play Store, ändert sich nur diese Liste –
  // QR-Codes, Einladungen und Webseite bleiben gleich.
  // Von oben nach unten: das erste Datum, das schon erreicht ist, gilt.
  // =====================================================================
  var PLAN = [
    // ["2026-12-15", "https://play.google.com/store/apps/details?id=de.wuzzo.wuzzo"], // 🎉 für alle (Datum eintragen, sobald Google freigibt)
    ["2026-11-27", "https://play.google.com/apps/testing/de.wuzzo.wuzzo"],            // 🧪 geschlossener Test (Tester-Liste)
    ["2000-01-01", "https://play.google.com/apps/internaltest/4700548647227979651"]  // 🔒 interner Test (bis 26.11.)
  ];
  var heute = new Date().toISOString().slice(0, 10), ziel = PLAN[PLAN.length - 1][1];
  for (var i = 0; i < PLAN.length; i++) { if (heute >= PLAN[i][0]) { ziel = PLAN[i][1]; break; } }
  // 🌍 ab 0.51: Google-Seite in der Sprache des Besuchers (Deutsch, Українська, Русский …)
  var sp = "de";
  try { sp = (new URLSearchParams(location.search).get("l") || localStorage.getItem("wz_lang") || navigator.language || "de"); } catch (e) { sp = navigator.language || "de"; }
  sp = String(sp).slice(0, 2).toLowerCase();
  if (["de","uk","ru","en","pl","tr","es","fr","it","pt"].indexOf(sp) < 0) sp = "en";
  ziel += (ziel.indexOf("?") < 0 ? "?" : "&") + "hl=" + sp;
  location.replace(ziel);
</script>
</head>
<body>
  <div>
    <b>WU<span>ZZ</span>O</b>
    <p>Du wirst zu Google Play weitergeleitet …</p>
    <a id="go" href="https://play.google.com/apps/testing/de.wuzzo.wuzzo">▶️ Wuzzo bei Google Play holen</a>
    <script>document.getElementById("go").href = ziel;</script>
  </div>
<!-- 🔒 Wuzzo-Schutz: kein Rechtsklick-Fenster, kein Kopieren, kein Drucken, keine Entwickler-Tasten -->
<style id="wz-schutz">
  html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
  img,a{-webkit-user-drag:none}
  @media print{body{display:none!important}}
</style>
<script id="wz-schutz-js">
(function(){
  var frei = function(e){ var t = e.target; return t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]'); };
  ['contextmenu','dragstart'].forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }, true); });
  ['copy','cut','selectstart'].forEach(function(n){ document.addEventListener(n, function(e){ if (!frei(e)) e.preventDefault(); }, true); });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    var weg = k === 'f12'
      || (c && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 'k'))
      || (c && (k === 'u' || k === 's' || k === 'p'))
      || (c && (k === 'c' || k === 'x' || k === 'a') && !frei(e));
    if (weg){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
